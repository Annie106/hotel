<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3e3cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>夕照 · 独栋别墅 | 3D 实景建模</title>
<style>
  :root{
    --ink:#2f2b2a;
    --ink-2:#6d6662;
    --line:rgba(120,95,75,.16);
    --card:rgba(255,253,250,.82);
    --accent:#b35c2a;
    --accent-soft:#fbecdd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#e8d3bb;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* touch-action:none 是移动端 3D 手势跟手的关键，禁止浏览器抢走滚动/缩放 */
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}

  .glass{
    background:var(--card);
    backdrop-filter:blur(20px) saturate(1.25);
    -webkit-backdrop-filter:blur(20px) saturate(1.25);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 10px 36px rgba(92,58,32,.16),0 1px 2px rgba(92,58,32,.08);
    border-radius:16px;
  }

  #brand{position:fixed;left:22px;top:22px;padding:17px 21px 16px;max-width:310px;z-index:10}
  #brand .eyebrow{font-size:10px;letter-spacing:.28em;color:var(--accent);font-weight:700;margin-bottom:8px}
  #brand h1{font-size:23px;line-height:1.25;font-weight:650;letter-spacing:.04em}
  #brand .en{font-size:10px;letter-spacing:.24em;color:var(--ink-2);margin-top:6px;text-transform:uppercase}
  #brand p{font-size:11.5px;line-height:1.75;color:var(--ink-2);margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}

  #panel{position:fixed;right:22px;top:22px;width:238px;padding:16px;z-index:10;max-height:calc(100vh - 44px);overflow:auto}
  .sec{margin-bottom:16px}
  .sec:last-child{margin-bottom:0}
  .sec-t{font-size:10px;letter-spacing:.2em;color:var(--ink-2);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .sec-t::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .vbtn,.fbtn{
    font-size:11.5px;padding:8px 6px;border-radius:9px;text-align:center;
    background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink-2);
    transition:all .18s ease;white-space:nowrap;
  }
  .vbtn:hover,.fbtn:hover{background:#fff;border-color:rgba(179,92,42,.4);color:var(--accent)}
  .vbtn.on,.fbtn.on{background:var(--accent-soft);border-color:rgba(179,92,42,.45);color:var(--accent);font-weight:650}
  .wide{grid-column:1 / -1}
  .row{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;font-size:11.5px;color:var(--ink-2)}
  .row span{letter-spacing:.02em}
  .sw{width:34px;height:19px;border-radius:20px;background:#d9d2ca;position:relative;transition:background .2s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s}
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(15px)}

  #timeline{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(520px,calc(100vw - 44px));padding:13px 20px 14px;z-index:10}
  .tl-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .tl-head b{font-size:12px;font-weight:650;letter-spacing:.05em}
  .tl-head em{font-size:11px;font-style:normal;color:var(--accent);font-weight:700;letter-spacing:.08em}
  input[type=range]{width:100%;height:5px;border-radius:5px;appearance:none;-webkit-appearance:none;
    background:linear-gradient(90deg,#7ea6c9 0%,#f0bf7c 42%,#e98a4f 68%,#c4584a 84%,#574a78 100%);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 7px rgba(0,0,0,.22)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 7px rgba(0,0,0,.22)}
  .tl-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-2);margin-top:7px;letter-spacing:.05em}

  #hint{position:fixed;left:22px;bottom:22px;padding:10px 14px;font-size:10.5px;line-height:1.8;color:var(--ink-2);z-index:10}
  #hint b{color:var(--ink);font-weight:600}
  #hint kbd{background:rgba(120,95,75,.1);border-radius:4px;padding:1px 5px;font-family:inherit;font-size:10px}

  /* 仅移动端出现：抽屉开关 + 手势提示 */
  #mobileToggle{display:none}
  #mobileHint{display:none}
  .mt-bars{display:inline-flex;flex-direction:column;gap:3px;flex:none}
  .mt-bars i{display:block;width:15px;height:2px;border-radius:2px;background:var(--accent)}

  #loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f3e3cf;transition:opacity .7s ease}
  #loading.gone{opacity:0;pointer-events:none}
  .spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(179,92,42,.2);border-top-color:var(--accent);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading p{font-size:12px;color:var(--ink-2);letter-spacing:.14em}

  #err{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:30px;background:#f3e3cf;text-align:center;font-size:14px;line-height:1.9;color:var(--ink)}
  /* 竖屏窄机、横屏矮屏、以及一切触屏设备都走移动布局 */
  @media (max-width:760px), (max-height:500px), (pointer:coarse){
    .glass{background:rgba(255,253,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

    /* 顶部只留一行标题，把画面尽量让给 3D */
    #brand{
      max-width:none;left:calc(12px + env(safe-area-inset-left));
      top:calc(12px + env(safe-area-inset-top));
      padding:10px 14px;border-radius:12px;
    }
    #brand .eyebrow,#brand .en,#brand p{display:none}
    #brand h1{font-size:14px;letter-spacing:.02em}

    #mobileToggle{
      display:flex;align-items:center;gap:9px;position:fixed;z-index:14;
      right:calc(12px + env(safe-area-inset-right));
      top:calc(12px + env(safe-area-inset-top));
      min-height:44px;padding:0 15px;border-radius:12px;
      font-size:12.5px;font-weight:650;color:var(--ink);
    }
    #mobileToggle[aria-expanded="true"]{background:var(--accent-soft);border-color:rgba(179,92,42,.4)}

    /* 控制面板改为底部抽屉，默认收起不挡画面 */
    #panel{
      left:calc(10px + env(safe-area-inset-left));
      right:calc(10px + env(safe-area-inset-right));
      top:auto;width:auto;
      bottom:calc(116px + env(safe-area-inset-bottom));
      max-height:calc(100vh - 196px);padding:15px;border-radius:18px;z-index:13;
      overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
      transform:translateY(20px) scale(.985);opacity:0;pointer-events:none;
      transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease;
    }
    #panel::-webkit-scrollbar{width:4px}
    #panel::-webkit-scrollbar-thumb{background:rgba(179,92,42,.35);border-radius:4px}
    body.panel-open #panel{transform:none;opacity:1;pointer-events:auto}

    /* 触摸目标 ≥44px */
    .grid{gap:8px}
    .vbtn,.fbtn{min-height:44px;font-size:12.5px;padding:10px 6px;border-radius:10px}
    .vbtn:active,.fbtn:active{background:var(--accent-soft);color:var(--accent)}
    .row{min-height:46px;font-size:13px}
    .sec{margin-bottom:15px}
    .sec-t{font-size:11px;margin-bottom:10px}
    .sw{width:46px;height:26px}
    .sw::after{width:22px;height:22px}
    .sw.on::after{transform:translateX(20px)}

    /* 时间轴常驻底部：触摸区加大，视觉轨道仍保持细 */
    #timeline{
      left:calc(10px + env(safe-area-inset-left));
      right:calc(10px + env(safe-area-inset-right));
      transform:none;width:auto;
      bottom:calc(10px + env(safe-area-inset-bottom));
      padding:12px 16px 10px;border-radius:16px;
    }
    .tl-head{margin-bottom:4px}
    #timeline input[type=range]{
      height:30px;border-radius:5px;
      background-size:100% 5px;background-position:center center;background-repeat:no-repeat;
    }
    #timeline input[type=range]::-webkit-slider-thumb{width:24px;height:24px;border-width:3px}
    #timeline input[type=range]::-moz-range-thumb{width:20px;height:20px;border-width:3px}
    .tl-scale{font-size:10px;margin-top:2px}

    #hint{display:none}
    #mobileHint{
      display:block;position:fixed;z-index:12;left:50%;transform:translateX(-50%);
      top:calc(74px + env(safe-area-inset-top));
      padding:9px 16px;border-radius:20px;font-size:11.5px;
      color:var(--ink-2);white-space:nowrap;transition:opacity .6s ease;
    }
    #mobileHint.gone{opacity:0;pointer-events:none}
  }

  /* 横屏 / 矮屏：再压缩一层 UI */
  @media (max-width:900px) and (max-height:480px){
    #brand{display:none}
    #mobileHint{top:calc(12px + env(safe-area-inset-top))}
    /* 横屏三列并排：所有控件一屏可见，无需滚动 */
    #panel{
      max-height:calc(100vh - 150px);bottom:calc(86px + env(safe-area-inset-bottom));
      padding:12px;
      display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0 14px;align-content:start;
    }
    #views,#floors{grid-template-columns:repeat(2,1fr)}
    .wide{grid-column:auto}
    #panel .sec{margin-bottom:0}
    .vbtn,.fbtn{min-height:38px;font-size:11.5px}
    .row{min-height:40px;font-size:12px}
    #timeline{padding:8px 14px 6px}
    .tl-scale{display:none}
    #mobileToggle{min-height:38px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<button id="mobileToggle" class="glass" aria-expanded="false" aria-controls="panel">
  <span class="mt-bars"><i></i><i></i><i></i></span><span>视角 · 图层</span>
</button>

<div id="brand" class="glass">
  <div class="eyebrow">ARCHITECTURAL VISUALIZATION</div>
  <h1>夕照 · 独栋别墅</h1>
  <div class="en">Sunset Villa / 3D Model</div>
  <p>两层现代独栋 · 双层挑空客厅 · 全套室内家具 · 泳池与庭院。拖动时间轴，看光线从午后一路沉入黄昏。</p>
</div>

<div id="panel" class="glass">
  <div class="sec">
    <div class="sec-t">镜头视角</div>
    <div class="grid" id="views">
      <button class="vbtn on" data-view="overview">全景俯瞰</button>
      <button class="vbtn" data-view="exterior">别墅外观</button>
      <button class="vbtn" data-view="living">挑空客厅</button>
      <button class="vbtn" data-view="dining">餐厨空间</button>
      <button class="vbtn" data-view="bedroom">主卧套间</button>
      <button class="vbtn" data-view="study">书房</button>
      <button class="vbtn wide" data-view="pool">泳池 · 夕阳</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-t">楼层剖切</div>
    <div class="grid" id="floors">
      <button class="fbtn on" data-floor="all">整栋</button>
      <button class="fbtn" data-floor="1">一层平面</button>
      <button class="fbtn" data-floor="2">二层平面</button>
      <button class="fbtn" data-floor="shell">建筑结构</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-t">显示设置</div>
    <div class="row"><span>屋顶覆盖</span><button class="sw" id="swRoof" aria-label="屋顶"></button></div>
    <div class="row"><span>室内家具</span><button class="sw on" id="swFurniture" aria-label="家具"></button></div>
    <div class="row"><span>夜晚灯光</span><button class="sw on" id="swLights" aria-label="灯光"></button></div>
    <div class="row"><span>自动环绕</span><button class="sw" id="swRotate" aria-label="环绕"></button></div>
  </div>
</div>

<div id="timeline" class="glass">
  <div class="tl-head"><b>日照时间轴</b><em id="timeLabel">18:30 · 黄金时刻</em></div>
  <input type="range" id="time" min="0" max="100" value="62" step="1" aria-label="时间">
  <div class="tl-scale"><span>16:00 午后</span><span>18:00</span><span>19:00 日落</span><span>20:00 暮色</span></div>
</div>

<div id="hint" class="glass">
  <b>操作</b>　<kbd>左键拖动</kbd> 旋转　<kbd>滚轮</kbd> 缩放　<kbd>右键拖动</kbd> 平移<br>
  屋顶默认已掀开，可直接俯视两层家具与夕阳庭院
</div>

<div id="mobileHint" class="glass">单指拖动旋转 · 双指缩放与平移 · 双击回到全景</div>

<div id="loading"><div class="spin"></div><p>正在构建别墅与光影…</p></div>
<div id="err"></div>

<script src="./vendor/three.global.js"></script>
<script src="./app.js"></script>
</body>
</html>
